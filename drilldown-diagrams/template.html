    const box = svg.viewBox.baseVal
    mapNatural = { width: box.width * (4 / 3), height: box.height * (4 / 3) }
    svg.removeAttribute('width')
    svg.removeAttribute('height')
    svg.setAttribute('role', 'img')
    svg.setAttribute('aria-label', `Whole map of ${views.get(mapRoot).title}`)
    for (const element of svg.querySelectorAll('[id]')) element.id = `${MAP_ID}--${element.id}`
    for (const group of svg.querySelectorAll('g.node, g.cluster')) {
      const title = group.querySelector(':scope > title')?.textContent ?? ''
      const separator = title.indexOf('::')
      group.dataset.home = separator > 0 ? title.slice(0, separator) : ''
      group.dataset.name = separator > 0 ? title.slice(separator + 2) : title
      const anchor = group.querySelector('a')
      const href = anchor?.getAttributeNS(XLINK, 'href') ?? anchor?.getAttribute('href') ?? ''
      if (!href.startsWith('#')) continue
      group.dataset.target = href.slice(1)
      if (separator > 0 && href.slice(1) !== group.dataset.home) group.classList.add('drill')
    }
    stage.replaceChildren(svg)
    addBadges(mapSection)
    addMapToggles()
    const maxDepth = treeDepth(mapRoot)
    mapSection.querySelector('figcaption').textContent = `${shown} views under ${views.get(mapRoot).title}, ${
      mapOverrides.size > 0 ? 'with groups you opened or closed' : mapDepth >= maxDepth ? 'every level' : mapDepth === 0 ? 'top level only' : mapDepth === 1 ? 'one level deep' : `${mapDepth} levels deep`
    }, drawn as one diagram. Each dashed group is a view; click a box or a group's name to open its own diagram.`
    fitMap()
  }
  function renderMapChrome() {
    const root = views.get(mapRoot)
    const rootItem = document.createElement('li')
    const rootButton = document.createElement('button')
    rootButton.type = 'button'
    rootButton.textContent = root.title
    rootButton.addEventListener('click', () => go(mapRoot))
    rootItem.append(rootButton)
    const mapItem = document.createElement('li')
    const mapLabel = document.createElement('span')
    mapLabel.setAttribute('aria-current', 'page')
    mapLabel.textContent = 'Whole map'
    mapItem.append(mapLabel)
    crumbsEl.replaceChildren(rootItem, mapItem)
    rootsEl.replaceChildren(
      ...roots().map(view => {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = view.title
        button.setAttribute('aria-pressed', String(view.id === mapRoot))
        button.addEventListener('click', () => go(view.id))
        return button
      })
    )
    rootsEl.hidden = roots().length < 2
    titleEl.textContent = `${root.title}: whole map`
    renderLegend(mapSection)
    hintEl.textContent = ''
  }
  function showMap() {
    if (currentId === MAP_ID) return
    if (editing) {
      setStatus('Finish editing to open the whole map.', 'bad')
      try {
        if (currentId != null) writeRoute(currentId)
      } catch {}
      return
    }
    const fromId = currentId
    mapRoot = (fromId != null ? ancestry(fromId)[0] : null) ?? (views.has(mapRoot) ? mapRoot : roots()[0]?.id)
    if (mapRoot == null) return
    const maxDepth = Math.max(1, treeDepth(mapRoot))
    mapDepth = Math.min(Math.max(0, mapDepth ?? storedMapDepth() ?? maxDepth), maxDepth)
    ensureMapSection()
    if (fromId != null) views.get(fromId)?.section?.setAttribute('hidden', '')
    mapSection.hidden = false
    currentId = MAP_ID
    renderDepthButtons()
    renderMap()
    renderChrome(MAP_ID)
    if (!reducedMotion.matches && fromId != null) {
      mapSection.querySelector('.figure').animate([{ transform: 'scale(0.94)', opacity: 0 }, { transform: 'none', opacity: 1 }], {
        duration: 260,
        easing: 'cubic-bezier(.2,.75,.25,1)',
      })
    }
    titleEl.focus({ preventScroll: true })
  }
  mapToggle.addEventListener('click', () => {
    if (currentId === MAP_ID) go(mapRoot)
    else go(MAP_ID)
  })

  // ---------- editing ----------
  function labelOf(view, name) {
    const object = view.objects.get(name)
    const raw = object?.label
    if (raw == null || raw === '\\N' || raw === '') return name.startsWith('cluster') ? '' : name
    return decodeDot(raw)
  }
  function descriptionOf(view, name) {
    return decodeDot(view.objects.get(name)?.description ?? '')
  }
  function firstLine(text) {
    return text.split('\n')[0].trim()
  }
  function renameView(viewId, oldTitle, newTitle) {
    editView(viewId, text => setGraphAttr(text, 'title', newTitle))
    let renamedBoxes = 0
    for (const view of views.values()) {
      for (const [name, object] of view.objects) {
        if (object.URL !== `#${viewId}`) continue
        const label = labelOf(view, name)
        if (firstLine(label) !== oldTitle) continue
        const lines = label.split('\n')
        lines[0] = newTitle
        const isCluster = name.startsWith('cluster')
        editView(view.id, text => (isCluster ? setClusterAttr : setNodeAttr)(text, name, 'label', lines.join('\n')))
        renamedBoxes += 1
      }
    }
    return renamedBoxes
  }
  function describeRenamed(count) {
    return count === 0 ? '' : ` Also renamed ${count === 1 ? '1 box' : `${count} boxes`} that open this view.`
  }
  function editCount() {
    return source === savedSource ? 0 : 1
  }
  function setStatus(message, tone) {
    editStatus.textContent = message
    editStatus.className = `edit-status${tone ? ` ${tone}` : ''}`
  }
  function storeDraft() {
    try {
      if (editCount() > 0) localStorage.setItem(DRAFT_KEY, JSON.stringify({ base: savedSource, source }))
      else localStorage.removeItem(DRAFT_KEY)
    } catch {}
  }
  function takeDraft() {
    try {
      const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) ?? 'null')
      if (draft?.base === savedSource && typeof draft.source === 'string' && draft.source !== savedSource) return draft.source
      localStorage.removeItem(DRAFT_KEY)
    } catch {}
    return null
  }
  function updateDirty() {
    const dirty = editCount() > 0 || dotDraftInvalid
    saveButton.disabled = !dirty || dotDraftInvalid
    discardButton.disabled = !dirty
    undoButton.disabled = !(doc?.canUndo ?? false)
    redoButton.disabled = !(doc?.canRedo ?? false)
    editToolsEl.hidden = !editing
    editbar.hidden = !(editing || dirty || keepBarOpen)
    editToggle.textContent = editing ? (dirty && MODE === 'artifact' ? 'Save and finish' : 'Done editing') : 'Edit'
    if (dotDraftInvalid) setStatus('The DOT has an error; fix it to apply and save.', 'bad')
    else if (editing && modelProblems.length > 0) setStatus('Unsaved changes. Fix the problems listed in the DOT editor before saving.', 'bad')
    else if (editing) setStatus(dirty ? 'Unsaved changes.' : 'No unsaved changes.', '')
    else if (dirty) setStatus('Unsaved changes. Download the updated file to keep them.', 'bad')
    storeDraft()
  }
  function setEditing(on) {
    editing = on
    root.classList.toggle('is-editing', on)
    editToggle.setAttribute('aria-pressed', String(on))
    setEditable(titleEl, on)
    if (!on) {
      closeEditor()
      setDotOpen(false)
    }
    for (const view of views.values()) applyEditAffordances(view)
    const view = views.get(currentId)
    if (on && view != null) mountCanvas(view)
    if (!on) {
      unmountCanvas()
      if (view != null) renderView(view)
    }
    if (view?.section != null) {
      showText(view.section.querySelector('figcaption'), view.caption)
      showText(view.section.querySelector('.notes'), view.notes)
    }
    renderChrome(currentId)
    updateDirty()
  }
  function flashSaved(message) {
    keepBarOpen = true
    updateDirty()
    setStatus(message, 'ok')
    clearTimeout(flashSaved.timer)
    flashSaved.timer = setTimeout(() => {
      keepBarOpen = false
      updateDirty()
    }, 4000)
  }
  function otherViewsShowing(name, label) {
    return [...views.values()].filter(
      view => view.id !== currentId && view.objects.has(name) && !name.startsWith('cluster') && labelOf(view, name) === label
    )
  }
  function openEditor(group) {
    if (blockedByDotDraft()) return
    const view = views.get(currentId)
    const name = group.dataset.name
    const isCluster = group.classList.contains('cluster')
    const label = labelOf(view, name)
    const others = otherViewsShowing(name, label)
    editorTarget = { name, isCluster, label, description: descriptionOf(view, name), others: others.map(other => other.id) }
    for (const selected of viewsEl.querySelectorAll('.is-selected')) selected.classList.remove('is-selected')
    group.classList.add('is-selected')
    $('editor-heading').textContent = isCluster ? 'Edit group' : 'Edit node'
    $('editor-id').textContent = name
    $('editor-label').value = label
    $('editor-description').value = editorTarget.description
    $('editor-spread-row').hidden = others.length === 0
    $('editor-spread').checked = true
    $('editor-spread-text').textContent = `Also update it in ${others.length === 1 ? '1 other view' : `${others.length} other views`}: ${others.map(other => other.title).join(', ')}`
    const target = group.dataset.target
    const targetView = target == null ? null : views.get(target)
    const linked = targetView != null && firstLine(label) === targetView.title
    editorTarget.linkedView = linked ? target : null
    $('editor-view-row').hidden = !linked
    $('editor-view').checked = true
    $('editor-view-text').textContent = linked ? `Also rename the view it opens (“${targetView.title}”), its breadcrumb, and other boxes that open it` : ''
    $('editor-open').hidden = targetView == null
    editor.hidden = false
    const rect = group.getBoundingClientRect()
    const width = editor.offsetWidth
    const height = editor.offsetHeight
    const reservedBottom = editbar.hidden ? 0 : editbar.offsetHeight
    const roomBelow = window.innerHeight - reservedBottom - rect.bottom
    const placeAbove = roomBelow < height + 20 && rect.top > height + 20
    const left = Math.min(Math.max(16, rect.left + window.scrollX), window.scrollX + document.documentElement.clientWidth - width - 16)
    editor.style.left = `${left}px`
    editor.style.top = `${placeAbove ? rect.top + window.scrollY - height - 10 : rect.bottom + window.scrollY + 10}px`
    $('editor-label').focus({ preventScroll: true })
    $('editor-label').select()
    if (!placeAbove && roomBelow < height + 20) window.scrollBy({ top: height + 20 - roomBelow, behavior: reducedMotion.matches ? 'auto' : 'smooth' })
  }
  function closeEditor(restoreFocus) {
    if (editor.hidden) return
    editor.hidden = true
    const name = editorTarget?.name
    editorTarget = null
    const selected = viewsEl.querySelector('.is-selected')
    selected?.classList.remove('is-selected')
    if (restoreFocus && name != null) focusGroup(name)
  }
  function focusGroup(name) {
    const section = views.get(currentId)?.section
    const group = [...(section?.querySelectorAll('.stage g.node, .stage g.cluster') ?? [])].find(candidate => candidate.dataset.name === name)
    ;(group?.querySelector('a') ?? group)?.focus?.({ preventScroll: true })
  }
  function applyEditor() {
    if (editorTarget == null) return
    const label = $('editor-label').value.trim()
    const description = $('editor-description').value.trim()
    const { name, isCluster } = editorTarget
    const targets = [currentId, ...(!$('editor-spread-row').hidden && $('editor-spread').checked ? editorTarget.others : [])]
    for (const id of targets) {
      editView(id, text => {
        let next = text
        if (label !== editorTarget.label && label !== '') {
          next = isCluster ? setClusterAttr(next, name, 'label', label) : setNodeAttr(next, name, 'label', label)
        }
        if (description !== editorTarget.description) {
          next = isCluster ? setClusterAttr(next, name, 'description', description) : setNodeAttr(next, name, 'description', description)
        }
        return next
      })
    }
    let renamedBoxes = 0
    const renameLinkedView =
      editorTarget.linkedView != null && $('editor-view').checked && label !== '' && firstLine(label) !== firstLine(editorTarget.label)
    if (renameLinkedView) {
      parseModel()
      renamedBoxes = renameView(editorTarget.linkedView, firstLine(editorTarget.label), firstLine(label))
    }
    closeEditor()
    commitEdits()
    if (renameLinkedView) setStatus(`Unsaved changes. Renamed the view it opens.${describeRenamed(renamedBoxes)}`, '')
    focusGroup(name)
  }
  function commitText(element, key) {
    const value = element.innerText.replace(/ /g, ' ').trim()
    const view = views.get(currentId)
    const current = key === 'title' ? view.title : key === 'caption' ? view.caption : view.notes
    if (value === current) return
    if (blockedByDotDraft()) {
      element.textContent = current
      return
    }
    if (key === 'title' && value === '') {
      element.textContent = current
      return
    }
    if (key === 'title') {
      const renamedBoxes = renameView(currentId, current, value)
      commitEdits()
      if (renamedBoxes > 0) setStatus(`Unsaved changes.${describeRenamed(renamedBoxes)}`, '')
      return
    }
    editView(currentId, text => setGraphAttr(text, key, value))
    commitEdits()
  }
  function fillTemplate(dot) {
    const embeddedViz = document.getElementById('viz-lib')?.textContent ?? ''
    return PAGE_TEMPLATE.replace(SLOT_SOURCE, () => dot.replaceAll('</', '<\\/'))
      .replace(SLOT_VIZ, () => `<script id="viz-lib">${embeddedViz}<\/script>`)
      .replace(SLOT_TEMPLATE, () => JSON.stringify(PAGE_TEMPLATE).replace(/</g, '\\u003c'))
  }
  async function save() {
    if (blockedByDotDraft()) return false
    if (modelProblems.length > 0) {
      setStatus('Fix the problems listed in the DOT editor before saving.', 'bad')
      if (editing && !dotOpen) setDotOpen(true)
      return false
    }
    if (MODE === 'standalone') {
      const html = PAGE_SHELL.before + fillTemplate(source) + PAGE_SHELL.after
      const link = document.createElement('a')
      link.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }))
      link.download = `${(document.title || 'diagrams').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}.html`
      document.body.append(link)
      link.click()
      link.remove()
      setTimeout(() => URL.revokeObjectURL(link.href), 10000)
      savedSource = source
      flashSaved('Downloaded the updated file. Replace the old copy with it.')
      return true
    }
    const artifact = await window.claude?.use?.('artifact')
    if (artifact == null) {
      setStatus('Saving is not available in this view. Use Copy DOT to keep your changes.', 'bad')
      return false
    }
    saveButton.disabled = true
    editToggle.disabled = true
    setStatus('Saving…', '')
    try {
      // Save to this widget's own file, so a page may hold several diagrams
      // (system.dot, lifecycle.dot) and each saves independently.
      //
      // An inline model has no file to write: MODEL_PATH then names a <script>
      // in the page, and publishing to it would create a junk file instead of
      // saving. Such a widget is read-only by construction.
      if (!/\.dot$/i.test(MODEL_PATH)) {
        setStatus('This diagram is written into the page, so it cannot be saved here. Use Copy DOT.', 'bad')
        return false
      }
      await artifact.publish({ [MODEL_PATH]: { content: source, contentType: 'text/plain' } })
      savedSource = source
      flashSaved('Saved as a new version.')
      return true
    } catch (failure) {
      const code = failure?.code
      if (code === 'conflict') setStatus('Someone saved a newer version first. The page is reloading with theirs; your changes were not saved.', 'bad')
      else if (code === 'not_writer' || code === 'not_granted') setStatus('You can view this page but not save it. Use Copy DOT to keep your changes.', 'bad')
      else if (code === 'capability_disabled') setStatus('Saving is turned off for this view (for example a public link). Use Copy DOT to keep your changes.', 'bad')
      else setStatus(`Could not save: ${failure?.message ?? code ?? failure}`, 'bad')
      saveButton.disabled = editCount() === 0
      return false
    } finally {
      editToggle.disabled = false
    }
  }
  function copyText(text, button) {
    navigator.clipboard
      .writeText(text)
      .then(() => {
        const original = button.textContent
        button.textContent = 'Copied'
        setTimeout(() => {
          button.textContent = original
        }, 1500)
      })
      .catch(() => setStatus('Copy failed. Open "DOT source for this view" and select the text instead.', 'bad'))
  }

  // ---------- events ----------
  viewsEl.addEventListener('click', event => {
    const branchToggle = event.target.closest?.('.map-toggle')
    if (branchToggle != null) {
      event.preventDefault()
      event.stopPropagation()
      toggleMapBranch(branchToggle)
      return
    }
    const copy = event.target.closest('.source .copy')
    if (copy != null) {
      copyText(views.get(currentId)?.text ?? '', copy)
      return
    }
    const textLink = event.target.closest('figcaption a, .notes a')
    if (textLink != null && !editing) {
      const href = textLink.getAttribute('href') ?? ''
      if (href.startsWith('#')) {
        event.preventDefault()
        if (views.has(href.slice(1)) || href.slice(1) === MAP_ID) go(href.slice(1))
      }
      return
    }
    if (editing) return
    const anchor = event.target.closest('.stage a')
    if (anchor == null) return
    const href = anchor.getAttributeNS(XLINK, 'href') ?? anchor.getAttribute('href') ?? ''
    if (!href.startsWith('#')) return
    event.preventDefault()
    go(href.slice(1), anchor)
  })
  viewsEl.addEventListener('keydown', event => {
    if (!editing || (event.key !== 'Enter' && event.key !== ' ') || event.target.closest?.('.edit-canvas')) return
    const group = event.target.closest?.('.stage g.node, .stage g.cluster')
    if (group == null) return
    event.preventDefault()
    openEditor(group)
  })
  viewsEl.addEventListener('pointerover', event => {
    const group = event.target.closest?.('.stage g.node, .stage g.cluster')
    const onMap = currentId === MAP_ID
    const section = onMap ? mapSection : views.get(currentId)?.section
    const view = views.get(onMap ? group?.dataset.home : currentId)
    if (group == null || section == null || view == null) return
    const description = descriptionOf(view, group.dataset.name)
    const detail = section.querySelector('.detail')
    if (description === '') {
      detail.hidden = true
      return
    }
    const strong = document.createElement('strong')
    strong.textContent = labelOf(view, group.dataset.name).replace(/\n/g, ' ')
    detail.replaceChildren(strong, document.createTextNode(` — ${description}`))
    detail.hidden = false
  })
  viewsEl.addEventListener('focusout', event => {
    const element = event.target
    if (!editing || !element.isContentEditable) return
    if (element.tagName === 'FIGCAPTION') commitText(element, 'caption')
    else if (element.classList.contains('notes')) commitText(element, 'notes')
  })
  titleEl.addEventListener('focusout', () => {
    if (editing) commitText(titleEl, 'title')
  })
  document.addEventListener('keydown', event => {
    const element = event.target
    if (editing && event.key.toLowerCase() === 's' && (event.metaKey || event.ctrlKey)) {
      event.preventDefault()
      if (element === dotText) {
        clearTimeout(dotTimer)
        applyDotText()
      }
      if (!saveButton.disabled) save()
      return
    }
    if (editing && event.key.toLowerCase() === 'z' && (event.metaKey || event.ctrlKey) && !element.closest?.('textarea, input') && element.isContentEditable !== true) {
      event.preventDefault()
      syncDocument()
      if (event.shiftKey) doc?.redo()
      else doc?.undo()
      return
    }
    if (element === dotText && event.key === 'Escape') {
      event.preventDefault()
      dotText.blur()
      return
    }
    if (element.isContentEditable === true) {
      if (event.key === 'Escape') {
        const view = views.get(currentId)
        element.textContent = element === titleEl ? view.title : element.tagName === 'FIGCAPTION' ? view.caption : view.notes
        element.blur()
        event.preventDefault()
      } else if (event.key === 'Enter' && (element === titleEl || event.metaKey || event.ctrlKey)) {
        event.preventDefault()
        element.blur()
      }
      return
    }
    if (event.key !== 'Escape' || event.defaultPrevented) return
    if (!editor.hidden) {
      closeEditor(true)
      return
    }
    if (element.closest?.('textarea, input')) return
    if (editing && element.closest?.('.edit-canvas')) return
    if (currentId === MAP_ID) {
      go(mapRoot)
      return
    }
    const parent = views.get(currentId)?.parent
    if (parent != null && parent !== '' && views.has(parent)) go(parent)
  })
  editor.addEventListener('keydown', event => {
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
      event.preventDefault()
      applyEditor()
    }
  })
  document.addEventListener('pointerdown', event => {
    if (editor.hidden || editor.contains(event.target) || event.target.closest?.('.stage g.node, .stage g.cluster')) return
    closeEditor()
  })
  $('editor-apply').addEventListener('click', applyEditor)
  $('editor-cancel').addEventListener('click', () => closeEditor(true))
  $('editor-open').addEventListener('click', () => {
    const target = viewsEl.querySelector('.is-selected')?.dataset.target
    closeEditor()
    if (target != null) go(target)
  })
  editToggle.addEventListener('click', async () => {
    if (!editing) {
      setEditing(true)
      return
    }
    if (editCount() > 0 && MODE === 'artifact' && !(await save())) return
    setEditing(false)
  })
  saveButton.addEventListener('click', save)
  $('add-node').addEventListener('click', addNode)
  createGroupButton.addEventListener('click', () => canvas?.setTool(canvas.tool === 'box' ? 'select' : 'box'))
  toViewButton.addEventListener('click', turnIntoView)
  undoButton.addEventListener('click', () => {
    syncDocument()
    doc?.undo()
  })
  redoButton.addEventListener('click', () => {
    syncDocument()
    doc?.redo()
  })
  detailsButton.addEventListener('click', () => openDetails(selected))
  discardButton.addEventListener('click', () => {
    clearTimeout(dotTimer)
    dotDraftInvalid = false
    source = savedSource
    commitEdits()
    if (dotOpen) loadDot()
    setStatus('Changes discarded.', '')
  })
  $('copy-model').addEventListener('click', event => copyText(source, event.currentTarget))
  dotToggle.addEventListener('click', () => setDotOpen(!dotOpen))
  $('dot-scope-view').addEventListener('click', () => setDotScope('view'))
  $('dot-scope-model').addEventListener('click', () => setDotScope('model'))
  $('dot-close').addEventListener('click', () => {
    setDotOpen(false)
    dotToggle.focus()
  })
  dotText.addEventListener('scroll', syncDotScroll)
  dotText.addEventListener('input', () => {
    paintDot()
    clearTimeout(dotTimer)
    dotTimer = setTimeout(applyDotText, 250)
  })
  dotText.addEventListener('keydown', event => {
    if (event.key !== 'Tab' || event.shiftKey || event.metaKey || event.ctrlKey || event.altKey) return
    event.preventDefault()
    dotText.setRangeText('  ', dotText.selectionStart, dotText.selectionEnd, 'end')
    dotText.dispatchEvent(new Event('input'))
  })
  new ResizeObserver(() => document.documentElement.style.setProperty('--editbar-height', `${editbar.offsetHeight}px`)).observe(editbar)
  window.addEventListener('beforeunload', event => {
    if (editCount() > 0) event.preventDefault()
  })
  // Only a hash-routed instance listens: an embedded widget must ignore the
  // host page's URL, which belongs to the document around it.
  if (ROUTING === 'hash') {
    window.addEventListener('hashchange', () => {
      show(readRoute())
      keepFocus()
    })
  }
  window.addEventListener('focus', updateFocusNote)
  window.addEventListener('blur', updateFocusNote)

  // ---------- start ----------
  async function loadSource() {
    // Inline first: a <script type="text/vnd.graphviz"> either named by
    // data-dd-model or the page-level #model-source. Otherwise fetch the file.
    const inline = document.getElementById(MODEL_PATH) ?? document.getElementById('model-source')
    const embedded = inline?.textContent ?? ''
    if (embedded.trim() !== '') return embedded.replaceAll('<\\/', '</')
    const response = await fetch(MODEL_PATH, { cache: 'no-store' })
    if (!response.ok) throw new Error(`${MODEL_PATH} could not be loaded (HTTP ${response.status})`)
    return response.text()
  }
  async function offerEditing() {
    if (MODE === 'artifact') {
      const user = await window.claude?.use?.('user')
      const canEdit = user == null ? null : await user.canEdit().catch(() => null)
      if (canEdit === false) return
    }
    canEditPage = true
    updateTopButtons(currentId)
  }
  async function start() {
    try {
      if (typeof Viz?.instance !== 'function') throw new Error('the Graphviz library did not load')
      ;[viz, source] = await Promise.all([Viz.instance(), loadSource()])
    } catch (failure) {
      $('loading').className = 'load-error'
      $('loading').textContent = `Could not draw the diagrams: ${failure?.message ?? failure}`
      return
    }
    savedSource = source
    if (MODE === 'standalone') saveButton.textContent = 'Download updated file'
    const draft = takeDraft()
    if (draft != null) source = draft
    $('loading').remove()
    parseModel()
    try {
      doc = makeDocument(source)
    } catch {
      doc = null
    }
    if (views.size === 0) {
      viewsEl.textContent = 'The model has no digraph views.'
      return
    }
    show(readRoute())
    keepFocus()
    await offerEditing()
    if (draft != null) {
      if (currentId === MAP_ID) go(mapRoot)
      setEditing(true)
      setStatus('Restored your unsaved changes from last time. Save to keep them, or discard them.', '')
    }
  }
  start()
})()
</script>
