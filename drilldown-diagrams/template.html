<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="drilldown-mode" content="{{MODE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* One diagram stage at a time: breadcrumb trail above, caption and source below; opening a box zooms the stage out of it. Edit mode adds a box editor and a save bar. */
:root {
  --bg: #f4f5f8;
  --panel: #ffffff;
  --fg: #1a1f2c;
  --muted: #5b6476;
  --line: #d6dae3;
  --edge: #6a7387;
  --focus: #3d63dd;
  --focus-soft: #e3e9fd;
  --ok: #2f8a4f;
  --bad: #c2413b;
  --blue-fill: #e9edfc;
  --blue-line: #5a6fd8;
  --green-fill: #e4f3e9;
  --green-line: #3a9358;
  --amber-fill: #fbefdc;
  --amber-line: #c4862a;
  --violet-fill: #f0e9fb;
  --violet-line: #8761cf;
  --rose-fill: #fbe7ec;
  --rose-line: #c94c6e;
  --slate-fill: #eceef3;
  --slate-line: #6d778a;
  --shadow: 0 10px 30px rgba(20, 26, 40, 0.16);
  --selection: rgba(61, 99, 221, 0.22);
  --syn-keyword: #8a3fb8;
  --syn-string: #2b7a4b;
  --syn-attr: #2f5fc4;
  --syn-meta: #b0541c;
  --syn-comment: #8a93a5;
  --syn-arrow: #c2405f;
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-diagram: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c;
    --panel: #1a1e27;
    --fg: #e6e9ef;
    --muted: #98a1b3;
    --line: #333a48;
    --edge: #8f98ab;
    --focus: #8ea6ff;
    --focus-soft: #232c4a;
    --ok: #6cc489;
    --bad: #ef7a72;
    --blue-fill: #252c4b;
    --blue-line: #8c9cf0;
    --green-fill: #1d3325;
    --green-line: #6cc489;
    --amber-fill: #382a18;
    --amber-line: #e0a85a;
    --violet-fill: #2c2340;
    --violet-line: #b394f0;
    --rose-fill: #3a1f28;
    --rose-line: #ef8fa8;
    --slate-fill: #252931;
    --slate-line: #9aa3b5;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --selection: rgba(142, 166, 255, 0.28);
    --syn-keyword: #c79cf4;
    --syn-string: #8fd3a2;
    --syn-attr: #8eb6ff;
    --syn-meta: #f2aa6b;
    --syn-comment: #6f7a8f;
    --syn-arrow: #f095ad;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c;
  --panel: #1a1e27;
  --fg: #e6e9ef;
  --muted: #98a1b3;
  --line: #333a48;
  --edge: #8f98ab;
  --focus: #8ea6ff;
  --focus-soft: #232c4a;
  --ok: #6cc489;
  --bad: #ef7a72;
  --blue-fill: #252c4b;
  --blue-line: #8c9cf0;
  --green-fill: #1d3325;
  --green-line: #6cc489;
  --amber-fill: #382a18;
  --amber-line: #e0a85a;
  --violet-fill: #2c2340;
  --violet-line: #b394f0;
  --rose-fill: #3a1f28;
  --rose-line: #ef8fa8;
  --slate-fill: #252931;
  --slate-line: #9aa3b5;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --selection: rgba(142, 166, 255, 0.28);
  --syn-keyword: #c79cf4;
  --syn-string: #8fd3a2;
  --syn-attr: #8eb6ff;
  --syn-meta: #f2aa6b;
  --syn-comment: #6f7a8f;
  --syn-arrow: #f095ad;
  color-scheme: dark;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
[hidden] {
  display: none !important;
}
.wrap {
  max-width: 1120px;
  margin: 0 auto;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 18px;
}
.is-editing .wrap {
  padding-bottom: 120px;
}
.topline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 20px;
}
.top-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.crumbs ol {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--muted);
}
.crumbs li + li::before {
  content: "›";
  margin-right: 4px;
  color: var(--muted);
}
.crumbs button,
.roots button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 3px 6px;
  border-radius: 6px;
  cursor: pointer;
}
.crumbs button:hover {
  color: var(--fg);
  background: var(--panel);
}
.crumbs [aria-current] {
  color: var(--fg);
  font-weight: 500;
  padding: 3px 6px;
}
.roots {
  display: flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  font-size: 13px;
}
.roots button[aria-pressed="true"] {
  background: var(--bg);
  color: var(--fg);
  font-weight: 500;
}
.roots button[aria-pressed="false"] {
  color: var(--muted);
}
.tool {
  font: 500 13px var(--font-body);
  color: var(--fg);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 5px 12px;
  cursor: pointer;
}
.tool:hover {
  border-color: var(--edge);
}
.tool[aria-pressed="true"] {
  background: var(--focus-soft);
  border-color: var(--focus);
  color: var(--fg);
}
.tool.primary {
  background: var(--focus);
  border-color: var(--focus);
  color: var(--panel);
}
.tool:disabled {
  opacity: 0.55;
  cursor: default;
}
:is(.crumbs, .roots, .source, .editbar, .editor, .top-actions) button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  line-height: 1.15;
  letter-spacing: -0.01em;
  text-wrap: balance;
}
h1:focus {
  outline: none;
}
.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
  font-size: 13px;
  color: var(--muted);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  width: 12px;
  height: 12px;
  border-radius: 4px;
  border: 1.5px solid;
}
.swatch.ghost {
  border-style: dashed;
  border-color: var(--edge);
}
.hint .when-unfocused {
  display: none;
  color: var(--focus);
}
.drilldown.page-unfocused .hint .when-unfocused {
  display: inline;
}
.drilldown.page-unfocused .hint .when-focused {
  display: none;
}
.hint kbd {
  font-family: var(--font-mono);
  font-size: 11px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 4px;
  background: var(--panel);
}
.loading {
  color: var(--muted);
}
.load-error {
  color: var(--bad);
}

.view {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}
.view[hidden] {
  display: none;
}
.figure {
  margin: 0;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
}
.stage {
  overflow: auto;
  padding: 18px 12px;
}
.stage svg {
  display: block;
  margin: 0 auto;
  width: 100%;
  height: auto;
  max-width: calc(var(--view-width) * 1.3px);
  min-width: min(calc(var(--view-width) * 0.85px), 860px);
  overflow: visible;
}
.map-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
}
.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  font-size: 13px;
}
.seg button {
  font: inherit;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 3px 10px;
  border-radius: 6px;
  cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.seg button:hover {
  color: var(--fg);
}
.seg button[aria-pressed="true"] {
  background: var(--bg);
  color: var(--fg);
  font-weight: 500;
}
.seg button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}
.map-hint {
  font-size: 12px;
  color: var(--muted);
}
.stage.map-stage {
  height: min(74vh, 920px);
  padding: 16px;
  cursor: grab;
  overscroll-behavior: contain;
}
.stage.map-stage.panning {
  cursor: grabbing;
  user-select: none;
}
.stage.map-stage svg {
  max-width: none;
  min-width: 0;
  margin: 0;
}
.map-view .stage .cluster > g > a > text,
.map-view .stage .cluster > text {
  font-weight: 600;
}
.detail {
  border-top: 1px solid var(--line);
  padding: 10px 18px;
  font-size: 14px;
  background: var(--bg);
}
.detail strong {
  font-weight: 600;
}
figcaption {
  border-top: 1px solid var(--line);
  padding: 12px max(18px, calc(100% - 78ch - 18px)) 14px 18px;
  font-size: 14px;
  color: var(--muted);
}
.notes {
  margin: 0;
  max-width: 68ch;
  font-size: 16px;
  line-height: 1.65;
  white-space: pre-line;
}
figcaption:empty,
.notes:empty {
  display: none;
}
.is-editing :is(figcaption, .notes):empty {
  display: block;
}
.is-editing :is(figcaption, .notes, h1)[contenteditable]:empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
  font-style: italic;
}
.is-editing :is(figcaption, .notes, h1)[contenteditable] {
  cursor: text;
  border-radius: 6px;
  outline: 1px dashed var(--line);
  outline-offset: 4px;
}
.is-editing :is(figcaption, .notes, h1)[contenteditable]:focus {
  outline: 2px solid var(--focus);
}

.stage svg text {
  font-family: var(--font-diagram);
}
.stage .node text {
  fill: var(--fg);
  font-weight: 500;
}
.stage .node :is(path, polygon, ellipse) {
  stroke-width: 1.4;
}
.stage .node :is(path, polygon, ellipse)[fill="lightgrey"] {
  fill: var(--panel);
}
.stage .node :is(path, polygon, ellipse)[stroke="black"] {
  stroke: var(--edge);
}
.stage .node.blue { color: var(--blue-line); }
.stage .node.green { color: var(--green-line); }
.stage .node.amber { color: var(--amber-line); }
.stage .node.violet { color: var(--violet-line); }
.stage .node.rose { color: var(--rose-line); }
.stage .node.slate { color: var(--slate-line); }
.stage .node.ghost { color: var(--ghost-line, var(--edge)); }
.stage .node.blue :is(path, polygon, ellipse) { fill: var(--blue-fill); stroke: var(--blue-line); }
.stage .node.green :is(path, polygon, ellipse) { fill: var(--green-fill); stroke: var(--green-line); }
.stage .node.amber :is(path, polygon, ellipse) { fill: var(--amber-fill); stroke: var(--amber-line); }
.stage .node.violet :is(path, polygon, ellipse) { fill: var(--violet-fill); stroke: var(--violet-line); }
.stage .node.rose :is(path, polygon, ellipse) { fill: var(--rose-fill); stroke: var(--rose-line); }
.stage .node.slate :is(path, polygon, ellipse) { fill: var(--slate-fill); stroke: var(--slate-line); }
.stage .node.ghost :is(path, polygon, ellipse) {
  fill: var(--panel);
  stroke: var(--ghost-line, var(--edge));
  stroke-dasharray: 4 3;
}
.stage .node.ghost text {
  fill: var(--muted);
}
.stage .edge path {
  stroke: var(--edge);
  stroke-width: 1.2;
}
.stage .edge polygon {
  fill: var(--edge);
  stroke: var(--edge);
}
.stage .edge text {
  fill: var(--muted);
}
.stage .cluster :is(path, polygon) {
  fill: none;
  stroke: var(--line);
  stroke-width: 1.2;
}
.stage .cluster text {
  fill: var(--muted);
}

.stage .drill a {
  cursor: pointer;
  outline: none;
}
.stage .node.drill:not(.ghost) :is(path, polygon, ellipse) {
  stroke-width: 2.6;
}
.drilldown:not(.is-editing) .stage .node.drill a:hover :is(path, polygon, ellipse) {
  stroke-width: 3.4;
}
.drilldown:not(.is-editing) .stage .node.drill.ghost a:hover :is(path, polygon, ellipse),
.drilldown:not(.is-editing) .stage .cluster.drill a:hover :is(path, polygon) {
  stroke: var(--focus);
  stroke-dasharray: none;
}
.stage .cluster.drill text {
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}
.stage .drill a:focus-visible :is(path, polygon, ellipse) {
  stroke: var(--focus);
  stroke-width: 3.6;
  stroke-dasharray: none;
}
.stage .badge circle {
  fill: var(--panel);
  stroke: currentColor;
  stroke-width: 1.5;
}
.stage .badge path {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
}
.stage .badge.map-toggle {
  color: var(--focus);
  cursor: pointer;
}
.stage .badge.map-toggle:hover circle {
  fill: var(--focus-soft);
}
.stage .came-from :is(path, polygon, ellipse) {
  animation: came-from 1.4s ease-out;
}
@keyframes came-from {
  0%, 30% { stroke: var(--focus); stroke-width: 5; }
}
.is-editing .stage :is(g.node, g.cluster) {
  cursor: pointer;
  outline: none;
}
.is-editing .stage :is(g.node, g.cluster):is(:hover, :focus-visible, .is-selected) > :is(path, polygon, ellipse),
.is-editing .stage :is(g.node, g.cluster):is(:hover, :focus-visible, .is-selected) > g > a > :is(path, polygon, ellipse) {
  stroke: var(--focus);
  stroke-width: 3;
  stroke-dasharray: none;
}

.source summary {
  cursor: pointer;
  font-size: 13px;
  color: var(--muted);
  width: max-content;
}
.source summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}
.source-bar {
  display: flex;
  justify-content: flex-end;
  margin-top: 8px;
}
.source pre {
  margin: 8px 0 0;
  padding: 14px 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: auto;
  max-height: 420px;
  font: 12.5px/1.6 var(--font-mono);
}
.foot {
  font-size: 13px;
  color: var(--muted);
  max-width: 78ch;
  margin: 0;
}

.editbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 20;
  background: var(--panel);
  border-top: 1px solid var(--line);
  box-shadow: var(--shadow);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.editbar-inner {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
}
.edit-status {
  font-size: 14px;
  color: var(--muted);
  min-width: 0;
}
.edit-status.ok { color: var(--ok); }
.edit-status.bad { color: var(--bad); }
.editbar-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.edit-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  width: 100%;
}
.edit-tools .tool[aria-pressed="true"] {
  border-color: var(--accent);
  color: var(--accent);
}
.edit-tools .style-bar {
  --ds-accent: var(--accent);
  --ds-bg: var(--panel);
  --ds-fg: var(--fg);
  --ds-line: var(--line);
  --ds-muted: var(--muted);
  color: var(--fg);
  font-size: 13px;
}
.stage .edit-canvas {
  --dc-accent: var(--accent);
  --dc-editor-bg: var(--panel);
  --dc-editor-fg: var(--fg);
  overflow: visible;
}
.stage .edit-canvas svg.dc-overlay {
  width: auto;
  height: auto;
  max-width: none;
  min-width: 0;
  margin: 0;
}
:is(figcaption, .notes) :is(p, ul, ol, pre, blockquote) { margin: 0 0 6px; }
:is(figcaption, .notes) > :last-child { margin-bottom: 0; }
:is(figcaption, .notes) :is(h3, h4, h5, h6) { margin: 8px 0 4px; font-size: 1em; }
:is(figcaption, .notes) code { font-size: 0.92em; }
:is(figcaption, .notes) pre { overflow-x: auto; }
:is(figcaption, .notes) blockquote { border-left: 3px solid var(--line); padding-left: 10px; }

.editor {
  position: absolute;
  z-index: 30;
  width: min(340px, calc(100vw - 32px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
  padding: 14px;
  display: grid;
  gap: 8px;
  font-size: 13px;
}
.editor-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-size: 14px;
}
.editor-id {
  font: 11.5px var(--font-mono);
  color: var(--muted);
  overflow-wrap: anywhere;
}
.editor label {
  color: var(--muted);
  font-weight: 500;
}
.editor textarea {
  font: 14px/1.45 var(--font-body);
  color: var(--fg);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 9px;
  resize: vertical;
  width: 100%;
  box-sizing: border-box;
}
.editor textarea:focus {
  outline: 2px solid var(--focus);
  outline-offset: 0;
  border-color: var(--focus);
}
.editor .check {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  font-weight: 400;
  color: var(--fg);
}
.editor .check input {
  margin-top: 3px;
}
.editor-actions {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-top: 4px;
}
.editor-actions .spacer {
  flex: 1;
}
.dot-panel {
  position: fixed;
  top: 0;
  right: 0;
  bottom: var(--editbar-height, 64px);
  width: min(46vw, 680px);
  z-index: 25;
  background: var(--panel);
  border-left: 1px solid var(--line);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 14px 14px;
  box-sizing: border-box;
}
.dot-panel > .dot-editor {
  flex: 1 1 auto;
}
.has-dot-panel .wrap {
  margin-right: min(46vw, 680px);
}
.dot-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
}
.dot-head strong {
  flex: 1;
  min-width: 0;
  font: 600 14px var(--font-mono);
  overflow-wrap: anywhere;
}
.dot-scope {
  display: flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg);
  font-size: 13px;
}
.dot-scope button {
  font: inherit;
  color: var(--muted);
  background: none;
  border: 0;
  padding: 3px 8px;
  border-radius: 6px;
  cursor: pointer;
}
.dot-scope button[aria-pressed="true"] {
  background: var(--panel);
  color: var(--fg);
  font-weight: 500;
}
.dot-scope button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}
.dot-hint {
  flex-basis: 100%;
  font-size: 12px;
  color: var(--muted);
}
.dot-hint kbd {

<script>
(() => {
  const XLINK = 'http://www.w3.org/1999/xlink'
  const SVG_NS = 'http://www.w3.org/2000/svg'
  {{VALIDATOR}}
  {{EDITOR}}
  const SLOT_SOURCE = '{{' + 'SOURCE}}'
  const SLOT_TEMPLATE = '{{' + 'TEMPLATE}}'
  const SLOT_VIZ = '{{' + 'VIZ_SCRIPT}}'
  const MODE_META = document.querySelector('meta[name="drilldown-mode"]')
  const MODE = MODE_META?.content ?? 'artifact'
  const LAYOUT = {
    graphAttributes: { bgcolor: 'transparent', pad: '0.25', nodesep: '0.55', ranksep: '0.75', fontname: 'Helvetica', fontsize: '11' },
    nodeAttributes: { shape: 'box', style: 'rounded,filled', margin: '0.2,0.1', fontname: 'Helvetica', fontsize: '14' },
    edgeAttributes: { fontname: 'Helvetica', fontsize: '11', arrowsize: '0.7' },
  }
  const VIEW_HINT = 'Nodes with a thick outline and a corner badge open a deeper view. Dashed nodes jump to where they live. <span class="when-focused"><kbd>Esc</kbd> goes up a level.</span><span class="when-unfocused">Click the page to use <kbd>Esc</kbd>.</span>'
  const EDIT_HINT = 'Drag from a node to connect it, or into empty space for a new node. Select a node to recolor it, type to rename it, or press Tab for a connected node. Create group draws a dashed group around what you drag over; select a group to turn it into its own view. Click the title, caption or notes to edit them.'

  // Scoped to this widget's root, not the document, so two drill-downs can sit
  // on one page without fighting over element ids. The root is the nearest
  // [data-dd-root]; on a standalone page that is the only one.
  // Each instance claims the first root that has not been claimed yet, so two
  // embeds in one document each drive their own widget. A bare
  // document.querySelector would hand every script the first root on the page,
  // leaving the second widget stuck on "Drawing diagrams…".
  const root = document.querySelector('[data-dd-root]:not([data-dd-ready])')
  if (root == null) return
  root.setAttribute('data-dd-ready', '')

  // Data blocks belong to this instance when it carries its own; a standalone
  // page has one set at document level.
  const ownScript = name =>
    root.querySelector(`script[data-dd-data="${name}"]`) ?? document.getElementById(name)
  const PAGE_TEMPLATE = JSON.parse(ownScript('page-template')?.textContent ?? 'null')
  const PAGE_SHELL = JSON.parse(ownScript('page-shell')?.textContent ?? 'null')
  const $ = name => root.querySelector(`[data-dd="${name}"]`)

  // Per-instance settings, declared on the root element so the same code
  // serves a standalone page and a widget embedded in a document.
  //   data-dd-model   file to fetch, or the id of an inline <script> holding DOT
  //   data-dd-routing "hash" (default) writes location.hash; "none" keeps the
  //                   current view in memory, which is what lets two widgets
  //                   share a page without fighting over the URL.
  const MODEL_PATH = root.dataset.ddModel || 'model.dot'
  const ROUTING = root.dataset.ddRouting || 'hash'
  const INSTANCE = root.dataset.ddName || 'dd'

  // Reading and writing the current view goes through these, so `location.hash`
  // appears in exactly one place.
  let memoryRoute = ''
  const readRoute = () => (ROUTING === 'hash' ? location.hash.slice(1) : memoryRoute)
  const writeRoute = id => {
    if (ROUTING !== 'hash') { memoryRoute = id ?? ''; return }
    if (location.hash !== `#${id}`) location.hash = id
  }
  const viewsEl = $('views')
  const titleEl = $('view-title')
  const crumbsEl = $('crumbs')
  const rootsEl = $('roots')
  const legendEl = $('legend')
  const hintEl = $('hint')
  const editToggle = $('edit-toggle')
  const editbar = $('editbar')
  const editStatus = $('edit-status')
  const saveButton = $('save')
  const discardButton = $('discard')
  const editor = $('editor')
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)')

  let viz = null
  let source = ''
  let savedSource = ''
  let revision = 0
  let views = new Map()
  let currentId = null
  let editing = false
  let editorTarget = null
  let keepBarOpen = false
  const DRAFT_KEY = 'drilldown-draft'
  let modelProblems = []
  let dotOpen = false
  let dotDraftInvalid = false
  let dotTimer = null
  let dotScope = 'view'
  let dotViewId = null
  let dotBaseSource = ''
  let dotBaseId = null
  const dotPanel = $('dot-panel')
  const dotText = $('dot-text')
  const dotStatus = $('dot-status')
  const dotProblems = $('dot-problems')
  const dotToggle = $('dot-toggle')
  const editToolsEl = $('edit-tools')
  const undoButton = $('undo')
  const redoButton = $('redo')
  const detailsButton = $('details')
  const createGroupButton = $('create-group')
  const toViewButton = $('to-view')
  let canvas = null
  let canvasEl = null
  let canvasView = null
  let canvasBadges = null
  let doc = null
  let syncing = false
  let selected = null

  // ---------- DOT text helpers ----------
  function skipString(text, i) {
    for (let j = i + 1; j < text.length; j += 1) {
      if (text[j] === '\\') j += 1
      else if (text[j] === '"') return j + 1
    }
    return text.length
  }
  function skipHtml(text, i) {
    let depth = 0
    for (let j = i; j < text.length; j += 1) {
      if (text[j] === '<') depth += 1
      else if (text[j] === '>') {
        depth -= 1
        if (depth === 0) return j + 1
      }
    }
    return text.length
  }
  function skipComment(text, i) {
    if (text.startsWith('//', i)) {
      const end = text.indexOf('\n', i)
      return end < 0 ? text.length : end
    }
    if (text.startsWith('/*', i)) {
      const end = text.indexOf('*/', i + 2)
      return end < 0 ? text.length : end + 2
    }
    if (text[i] === '#' && (i === 0 || text[i - 1] === '\n')) {
      const end = text.indexOf('\n', i)
      return end < 0 ? text.length : end
    }
    return i
  }
  function previousSignificant(text, i) {
    let j = i - 1
    while (j >= 0 && /\s/.test(text[j])) j -= 1
    return j >= 0 ? text[j] : ''
  }
  function matchClose(text, open) {
    const opener = text[open]
    const closer = opener === '{' ? '}' : ']'
    let depth = 0
    for (let i = open; i < text.length; ) {
      const character = text[i]
      if (character === '"') {
        i = skipString(text, i)
        continue
      }
      const afterComment = skipComment(text, i)
      if (afterComment !== i) {
        i = afterComment
        continue
      }
      if (character === '<' && previousSignificant(text, i) === '=') {
        i = skipHtml(text, i)
        continue
      }
      if (character === opener) depth += 1
      else if (character === closer) {
        depth -= 1
        if (depth === 0) return i
      }
      i += 1
    }
    return -1
  }
  const BARE_ID = /[A-Za-z_\u0080-￿][\w\u0080-￿]*|-?(?:\.\d+|\d+(?:\.\d*)?)/y
  function readId(text, i) {
    if (text[i] === '"') {
      const end = skipString(text, i)
      return { value: text.slice(i + 1, end - 1).replace(/\\"/g, '"').replace(/\\\n/g, ''), end }
    }
    BARE_ID.lastIndex = i
    const match = BARE_ID.exec(text)
    return match == null ? null : { value: match[0], end: i + match[0].length }
  }
  function readValueEnd(text, i) {
    if (text[i] === '"') return skipString(text, i)
    if (text[i] === '<') return skipHtml(text, i)
    const match = /[^\s,;\]}]+/y
    match.lastIndex = i
    const found = match.exec(text)
    return found == null ? i : i + found[0].length
  }
  function forEachStatement(text, start, end, visit) {
    let depth = 0
    let atStart = true
    for (let i = start; i < end; ) {
      const character = text[i]
      const afterComment = skipComment(text, i)
      if (afterComment !== i) {
        i = afterComment
        continue
      }
      if (character === ' ' || character === '\t' || character === '\r') {
        i += 1
        continue
      }
      if (character === '\n' || character === ';') {
        atStart = true
        i += 1
        continue
      }
      if (character === '{') {
        depth += 1
        atStart = true
        i += 1
        continue
      }
      if (character === '}') {
        depth -= 1
        atStart = true
        i += 1
        continue
      }
      if (atStart) {
        if (visit(i, depth) === false) return
        atStart = false
      }
      if (character === '"') {
        i = skipString(text, i)
        continue
      }
      if (character === '[') {
        const close = matchClose(text, i)
        i = close < 0 ? end : close + 1
        continue
      }
      if (character === '<' && previousSignificant(text, i) === '=') {
        i = skipHtml(text, i)
        continue
      }
      i += 1
    }
  }
  function splitGraphs(text) {
    const graphs = []
    const header = /(?:strict\s+)?(?:di)?graph\s+("(?:[^"\\]|\\.)*"|[A-Za-z_]\w*)\s*\{/y
    for (let i = 0; i < text.length; ) {
      const afterComment = skipComment(text, i)
      if (afterComment !== i) {
        i = afterComment
        continue
      }
      if (/\s/.test(text[i])) {
        i += 1
        continue
      }
      header.lastIndex = i
      const match = header.exec(text)
      if (match == null) {
        i += 1
        continue
      }
      const open = match.index + match[0].length - 1
      const close = matchClose(text, open)
      if (close < 0) break
      const name = readId(text, match.index + match[0].indexOf(match[1])).value
      graphs.push({ id: name, start: match.index, end: close + 1 })
      i = close + 1
    }
    return graphs
  }
  function decodeDot(value) {
    return String(value ?? '').replace(/\\(.)/g, (whole, character) =>
      character === 'n' || character === 'l' || character === 'r' ? '\n' : character === '\\' ? '\\' : whole
    )
  }
  function quoteDot(value) {
    return `"${value.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n')}"`
  }
  function idToken(name) {
    return /^[A-Za-z_\u0080-￿][\w\u0080-￿]*$/.test(name) ? name : quoteDot(name)
  }
  function lineIndentAfter(text, open) {
    const match = /\n([ \t]+)\S/.exec(text.slice(open, open + 400))
    return match == null ? '  ' : match[1]
  }
  function setStatementAttr(text, open, key, value) {
    const close = matchClose(text, open)
    let found = null
    forEachStatement(text, open + 1, close, (position, depth) => {
      if (depth !== 0) return
      const match = /^([A-Za-z_]\w*)[ \t]*=[ \t]*/.exec(text.slice(position, position + 120))
      if (match != null && match[1] === key) {
        found = { start: position, valueStart: position + match[0].length }
        return false
      }
    })
    if (found != null) {
      const valueEnd = readValueEnd(text, found.valueStart)
      if (value === '') {
        const lineStart = text.lastIndexOf('\n', found.start) + 1
        const onlyIndentBefore = /^[ \t]*$/.test(text.slice(lineStart, found.start))
        let removeEnd = valueEnd
        if (text[removeEnd] === ';') removeEnd += 1
        if (onlyIndentBefore && text[removeEnd] === '\n') return text.slice(0, lineStart) + text.slice(removeEnd + 1)
        return text.slice(0, found.start) + text.slice(removeEnd)
      }
      return text.slice(0, found.valueStart) + quoteDot(value) + text.slice(valueEnd)
    }
    if (value === '') return text
    return `${text.slice(0, open + 1)}\n${lineIndentAfter(text, open)}${key}=${quoteDot(value)}${text.slice(open + 1)}`
  }
  function setListAttr(text, bracket, key, value) {
    const close = matchClose(text, bracket)
    let i = bracket + 1
    while (i < close) {
      while (i < close && /[\s,;]/.test(text[i])) i += 1
      const name = readId(text, i)
      if (name == null) {
        i += 1
        continue
      }
      let j = name.end
      while (/[ \t]/.test(text[j])) j += 1
      if (text[j] !== '=') {
        i = j
        continue
      }
      j += 1
      while (/[ \t]/.test(text[j])) j += 1
      const valueEnd = readValueEnd(text, j)
      if (name.value === key) {
        if (value === '') {
          let removeStart = i
          while (removeStart > bracket + 1 && /[ \t,]/.test(text[removeStart - 1])) removeStart -= 1
          return text.slice(0, removeStart) + text.slice(valueEnd)
        }
        return text.slice(0, j) + quoteDot(value) + text.slice(valueEnd)
      }
      i = valueEnd
    }
    if (value === '') return text
    const separator = text[close - 1] === '[' ? '' : ' '
    return `${text.slice(0, close)}${separator}${key}=${quoteDot(value)}${text.slice(close)}`
  }
  function graphOpen(blockText) {
    return blockText.indexOf('{', blockText.search(/graph\s/))
  }
  function setNodeAttr(blockText, nodeName, key, value) {
    const open = graphOpen(blockText)
    const close = matchClose(blockText, open)
    let bracket = -1
    forEachStatement(blockText, open + 1, close, position => {
      const id = readId(blockText, position)
      if (id == null || id.value !== nodeName) return
      let j = id.end
      while (/[ \t]/.test(blockText[j])) j += 1
      if (blockText[j] === '[') {
        bracket = j
        return false
      }
    })
    if (bracket >= 0) return setListAttr(blockText, bracket, key, value)
    if (value === '') return blockText
    const indent = lineIndentAfter(blockText, open)
    const lineStart = blockText.lastIndexOf('\n', close - 1) + 1
    const insertAt = /^[ \t]*$/.test(blockText.slice(lineStart, close)) ? lineStart : close
    const prefix = insertAt === close ? '\n' : ''
    return `${blockText.slice(0, insertAt)}${prefix}${indent}${idToken(nodeName)} [${key}=${quoteDot(value)}]\n${blockText.slice(insertAt)}`
  }
  function setClusterAttr(blockText, clusterName, key, value) {
    const open = graphOpen(blockText)
    const close = matchClose(blockText, open)
    let clusterOpen = -1
    forEachStatement(blockText, open + 1, close, position => {
      if (!blockText.startsWith('subgraph', position)) return
      let j = position + 'subgraph'.length
      while (/\s/.test(blockText[j])) j += 1
      const id = readId(blockText, j)
      if (id == null || id.value !== clusterName) return
      clusterOpen = blockText.indexOf('{', id.end)
      return false
    })
    return clusterOpen < 0 ? blockText : setStatementAttr(blockText, clusterOpen, key, value)
  }
  function setGraphAttr(blockText, key, value) {
    return setStatementAttr(blockText, graphOpen(blockText), key, value)
  }

  // ---------- model ----------
  function lineAt(text, index) {
    let line = 1
    for (let i = text.indexOf('\n'); i >= 0 && i < index; i = text.indexOf('\n', i + 1)) line += 1
    return line
  }
  function buildModel(text) {
    const blocks = splitGraphs(text)
    const next = new Map()
    const graphs = []
    const errors = []
    for (const block of blocks) {
      const blockText = text.slice(block.start, block.end)

    const node = Editor.newNodeId(source, { label: 'New node' })
    applyCanvasEdit({ type: 'addNode', node, attrs: { label: 'New node' } })
    const target = { kind: 'node', id: node }
    if (canvas != null && splitGraphs(source).some(block => block.id === currentId)) {
      canvas.select(target)
      canvas.editLabel(target)
      revealLabelField()
    }
  }
  function turnIntoView() {
    if (selected?.kind !== 'cluster' || blockedByDotDraft()) return
    const before = new Set(views.keys())
    applyCanvasEdit({ type: 'clusterToView', cluster: selected.id })
    const made = [...views.values()].find(view => !before.has(view.id))
    if (made != null) setStatus(`Unsaved changes. “${made.title}” is now its own view; click its thick outline to open it.`, '')
  }
  function renderCurrent() {
    const view = views.get(currentId)
    if (view == null) return
    if (view.renderedRevision !== revision) renderView(view)
    renderChrome(currentId)
  }
  function updateTopButtons(id) {
    editToggle.hidden = !canEditPage || id === MAP_ID
    mapToggle.hidden = editing || ![...views.values()].some(view => mapChildren(view.id).length > 0)
    mapToggle.setAttribute('aria-pressed', String(id === MAP_ID))
  }
  function renderLegend(section) {
    const legend = legendEntries()
    const present = new Set()
    for (const node of section?.querySelectorAll('.stage g.node') ?? []) {
      for (const name of node.classList) if (!['node', 'drill', 'came-from', 'is-selected'].includes(name)) present.add(name)
    }
    const order = [...new Set([...HUES.filter(hue => hue !== 'ghost'), ...legend.keys(), 'ghost'])]
    legendEl.replaceChildren(
      ...order
        .filter(name => present.has(name))
        .map(name => {
          const chip = document.createElement('span')
          chip.className = 'chip'
          const swatch = document.createElement('span')
          swatch.className = 'swatch'
          if (name === 'ghost') {
            swatch.classList.add('ghost')
            if (legend.get('ghost')?.color != null) swatch.style.borderColor = 'var(--ghost-line)'
          } else {
            swatch.style.background = `var(--${name}-fill)`
            swatch.style.borderColor = `var(--${name}-line)`

          chip.append(swatch, classLabel(name, legend.get(name)))
          return chip
        })
    )
  }
  function renderChrome(id) {
    updateTopButtons(id)
    if (id === MAP_ID) {
      renderMapChrome()
      return
    }
    const view = views.get(id)
    const chain = ancestry(id)
    crumbsEl.replaceChildren(
      ...chain.map((viewId, index) => {
        const item = document.createElement('li')
        const title = views.get(viewId).title
        if (index === chain.length - 1) {
          const span = document.createElement('span')
          span.setAttribute('aria-current', 'page')
          span.textContent = title
          item.append(span)
        } else {
          const button = document.createElement('button')
          button.type = 'button'
          button.textContent = title
          button.addEventListener('click', () => go(viewId))
          item.append(button)
        }
        return item
      })
    )
    rootsEl.replaceChildren(
      ...roots().map(root => {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = root.title
        button.setAttribute('aria-pressed', String(chain[0] === root.id))
        button.addEventListener('click', () => go(root.id))
        return button
      })
    )
    rootsEl.hidden = roots().length < 2
    if (!(editing && document.activeElement === titleEl)) titleEl.textContent = view.title
    renderLegend(view.section)
    if (editing) hintEl.textContent = EDIT_HINT
    else hintEl.innerHTML = view.section?.querySelector('.drill') != null ? VIEW_HINT : ''
  }
  function centerOf(element, container) {
    const rect = element.getBoundingClientRect()
    const host = container.getBoundingClientRect()
    return `${rect.left + rect.width / 2 - host.left}px ${rect.top + rect.height / 2 - host.top}px`
  }
  function show(requestedId, originEl) {
    if (requestedId === MAP_ID) {
      showMap()
      return
    }
    const id = views.has(requestedId) ? requestedId : roots()[0]?.id
    if (id == null || id === currentId) return
    if (dotOpen && dotDraftInvalid && dotScope === 'view' && currentId != null) {
      setStatus('Fix the DOT error in this view before leaving it, or discard your changes.', 'bad')
      try {
        writeRoute(currentId)
      } catch {}
      return
    }
    closeEditor()
    const previousId = currentId
    const next = views.get(id)
    const goingUp = previousId != null && ancestry(previousId).includes(id)
    const section = ensureSection(next)
    if (previousId != null) views.get(previousId)?.section?.setAttribute('hidden', '')
    if (previousId === MAP_ID) mapSection?.setAttribute('hidden', '')
    section.hidden = false
    currentId = id
    if (editing) unmountCanvas()
    if (next.renderedRevision !== revision || editing) renderView(next)
    else decorate(next)
    renderChrome(id)
    followViewInDot(id)

    const figure = section.querySelector('.figure')
    let cameFrom = null
    if (goingUp) {
      const chain = ancestry(previousId)
      const childOnPath = chain[chain.indexOf(id) + 1]
      cameFrom = section.querySelector(`[data-target="${CSS.escape(childOnPath)}"]`)
    }
    if (!reducedMotion.matches && previousId != null) {
      const anchor = goingUp ? cameFrom : originEl
      figure.style.transformOrigin = anchor != null ? centerOf(anchor, figure) : '50% 50%'
      figure.animate(
        goingUp
          ? [{ transform: 'scale(1.35)', opacity: 0 }, { transform: 'none', opacity: 1 }]
          : [{ transform: 'scale(0.55)', opacity: 0 }, { transform: 'none', opacity: 1 }],
        { duration: 280, easing: 'cubic-bezier(.2,.75,.25,1)' }

    if (cameFrom != null) {
      cameFrom.classList.remove('came-from')
      void cameFrom.getBoundingClientRect()
      cameFrom.classList.add('came-from')
      ;(cameFrom.querySelector('a') ?? cameFrom).focus?.({ preventScroll: true })

    }
  }
  function go(id, originEl) {

  }
  function updateFocusNote() {
    root.classList.toggle('page-unfocused', !document.hasFocus())
  }
  function keepFocus() {
    requestAnimationFrame(() => {

          window.focus()

  }

  // ---------- whole map ----------
  const MAP_ID = 'whole-map'
  const MAP_DEPTH_KEY = 'drilldown-map-depth'
  const mapToggle = $('map-toggle')
  let canEditPage = false
  let mapSection = null
  let mapRoot = null
  let mapDepth = null
  let mapKey = ''
  let mapZoom = 1
  let mapNatural = { width: 1, height: 1 }
  let mapDrag = null
  let mapSuppressClick = false
  const mapOverrides = new Map()
  let lastMapExpansion = new Map()

  function childViews(id) {
    return [...views.values()].filter(view => view.parent === id && view.id !== id)
  }
  function mapChildren(id) {
    const view = views.get(id)
    if (view == null) return []
    const children = childViews(id).map(child => child.id)
    for (const node of graphNodes(view.graph)) {
      const target = viewLink(node)
      if (node.class === 'ghost' || target == null || target === id || !views.has(target) || children.includes(target)) continue
      children.push(target)
    }
    return children
  }
  function mapExpansion(rootId, depth, useOverrides) {
    const level = new Map([[rootId, 0]])
    const parentOf = new Map()
    const queue = [rootId]
    while (queue.length > 0) {
      const id = queue.shift()
      for (const child of mapChildren(id)) {
        if (level.has(child)) continue
        const open = (useOverrides ? mapOverrides.get(child) : undefined) ?? level.get(id) < depth
        if (!open) continue
        level.set(child, level.get(id) + 1)
        parentOf.set(child, id)
        queue.push(child)
      }
    }
    return { level, parentOf }
  }
  function treeDepth(id) {
    return Math.max(0, ...mapExpansion(id, Number.POSITIVE_INFINITY, false).level.values())
  }
  function quoteRaw(value) {
    return `"${String(value).replace(/"/g, '\\"').replace(/\\$/, '\\\\')}"`
  }
  function graphNodes(graph) {
    return (graph.objects ?? []).slice(graph._subgraph_cnt ?? 0)
  }
  function graphClusters(graph) {
    return (graph.objects ?? [])
      .slice(0, graph._subgraph_cnt ?? 0)
      .filter(subgraph => String(subgraph.name).startsWith('cluster') && (subgraph.nodes ?? []).length > 0)
  }
  function viewLink(node) {
    return typeof node?.URL === 'string' && node.URL.startsWith('#') ? node.URL.slice(1) : null
  }
  function buildMapDot(rootId, depth) {
    const { level: expanded, parentOf } = mapExpansion(rootId, depth, true)
    lastMapExpansion = expanded
    const nodeIn = (viewId, name) => graphNodes(views.get(viewId).graph).find(node => node.name === name)
    const resolve = (viewId, name, hops = 0) => {
      const target = viewLink(nodeIn(viewId, name))
      if (hops < 8 && target != null && target !== viewId && expanded.has(target)) {
        if (parentOf.get(target) === viewId) return { cluster: target }
        const defined = nodeIn(target, name)
        if (defined != null && defined.class !== 'ghost') return resolve(target, name, hops + 1)
        return { cluster: target }
      }
      return { node: `${viewId}::${name}`, viewId }
    }
    const chainOf = id => {
      const chain = []
      for (let current = id; current != null && !chain.includes(current); current = parentOf.get(current)) chain.push(current)
      return chain
    }
    const inside = (endpoint, clusterId) => chainOf(endpoint.cluster ?? endpoint.viewId).includes(clusterId)

    const edges = []
    const seenEdges = new Set()
    const anchors = new Set()
    for (const viewId of expanded.keys()) {
      const graph = views.get(viewId).graph
      const byGvid = new Map(graphNodes(graph).map(node => [node._gvid, node]))
      for (const edge of graph.edges ?? []) {
        const tailNode = byGvid.get(edge.tail)
        const headNode = byGvid.get(edge.head)
        if (tailNode == null || headNode == null) continue
        const tail = resolve(viewId, tailNode.name)
        const head = resolve(viewId, headNode.name)
        const tailKey = tail.cluster != null ? `cluster:${tail.cluster}` : tail.node
        const headKey = head.cluster != null ? `cluster:${head.cluster}` : head.node
        const edgeKey = `${tailKey}|${headKey}|${edge.label ?? ''}`
        if (tailKey === headKey || seenEdges.has(edgeKey)) continue
        seenEdges.add(edgeKey)
        const attributes = []
        let from = tail.node
        let to = head.node
        if (tail.cluster != null) {
          from = `anchor::${tail.cluster}`
          anchors.add(tail.cluster)
          if (!inside(head, tail.cluster)) attributes.push(`ltail=${quoteRaw(`cluster_v_${tail.cluster}`)}`)
        }
        if (head.cluster != null) {
          to = `anchor::${head.cluster}`
          anchors.add(head.cluster)
          if (!inside(tail, head.cluster)) attributes.push(`lhead=${quoteRaw(`cluster_v_${head.cluster}`)}`)
        }
        for (const key of ['label', 'style', 'dir', 'arrowhead']) if (edge[key] != null && edge[key] !== '') attributes.push(`${key}=${quoteRaw(edge[key])}`)
        edges.push(`  ${quoteRaw(from)} -> ${quoteRaw(to)}${attributes.length > 0 ? ` [${attributes.join(' ')}]` : ''}`)
      }
    }

    const lines = ['digraph "whole-map" {', '  compound=true', `  rankdir=${quoteRaw(views.get(rootId).graph.rankdir ?? 'TB')}`]
    const emitted = new Set()
    const emitNode = (viewId, node, indent) => {
      const resolved = resolve(viewId, node.name)
      if (resolved.node !== `${viewId}::${node.name}` || emitted.has(resolved.node)) return
      emitted.add(resolved.node)
      const attributes = []
      const label = node.label == null || node.label === '\\N' ? node.name : node.label
      attributes.push(`label=${quoteRaw(label)}`)
      for (const key of ['class', 'shape', 'style', 'tooltip', 'description']) if (node[key] != null && node[key] !== '') attributes.push(`${key}=${quoteRaw(node[key])}`)
      const target = viewLink(node)
      attributes.push(`URL=${quoteRaw(`#${target != null && views.has(target) ? target : viewId}`)}`)
      lines.push(`${indent}${quoteRaw(resolved.node)} [${attributes.join(' ')}]`)
    }
    const emitView = (viewId, indent) => {
      const view = views.get(viewId)
      const isRoot = viewId === rootId
      const inner = isRoot ? indent : `${indent}  `
      if (!isRoot) {
        lines.push(
          `${indent}subgraph ${quoteRaw(`cluster_v_${viewId}`)} {`,
          `${inner}label=${quoteRaw(wrapLabel(view.title))}`,
          `${inner}fontname="Helvetica-Bold"`,
          `${inner}style="dashed,rounded"`,
          `${inner}URL=${quoteRaw(`#${viewId}`)}`,
          `${inner}tooltip=${quoteRaw(`Open ${view.title}`)}`
        )
      }
      if (anchors.has(viewId)) lines.push(`${inner}${quoteRaw(`anchor::${viewId}`)} [shape=point style=invis width=0.01 height=0.01 label=""]`)
      const nodes = graphNodes(view.graph)
      const clusters = graphClusters(view.graph)
      const homeCluster = new Map(
        nodes.map(node => [
          node._gvid,
          clusters.filter(cluster => cluster.nodes.includes(node._gvid)).sort((a, b) => a.nodes.length - b.nodes.length)[0] ?? null,
        ])
      )
      const children = [...parentOf].filter(([, parent]) => parent === viewId).map(([child]) => child)
      const childCluster = new Map(
        children.map(child => {
          const box = nodes.find(node => node.class !== 'ghost' && viewLink(node) === child)
          return [child, box == null ? null : homeCluster.get(box._gvid)]
        })
      )
      for (const cluster of clusters) {
        const members = nodes.filter(node => homeCluster.get(node._gvid) === cluster)
        if (members.length === 0) continue
        lines.push(`${inner}subgraph ${quoteRaw(`cluster_v_${viewId}__${cluster.name}`)} {`)
        if (cluster.label != null) lines.push(`${inner}  label=${quoteRaw(wrapLabel(cluster.label))}`, `${inner}  fontname="Helvetica-Bold"`)
        lines.push(`${inner}  style="dashed"`)
        for (const member of members) emitNode(viewId, member, `${inner}  `)
        for (const child of children) if (childCluster.get(child) === cluster) emitView(child, `${inner}  `)
        lines.push(`${inner}}`)
      }
      for (const node of nodes) if (homeCluster.get(node._gvid) == null) emitNode(viewId, node, inner)
      for (const child of children) if (childCluster.get(child) == null) emitView(child, inner)
      if (!isRoot) lines.push(`${indent}}`)
    }
    emitView(rootId, '  ')
    lines.push(...edges, '}')
    return { dot: lines.join('\n'), views: expanded.size }
  }

  function ensureMapSection() {
    if (mapSection != null) return mapSection
    mapSection = document.createElement('section')
    mapSection.className = 'view map-view'
    mapSection.dataset.view = MAP_ID
    mapSection.hidden = true
    mapSection.innerHTML = `<div class="map-controls">
<div class="seg map-depth" role="group" aria-label="How many levels to open"></div>
<div class="seg" role="group" aria-label="Zoom">
<button type="button" data-zoom="out" aria-label="Zoom out">−</button>
<button type="button" data-zoom="fit">Fit</button>
<button type="button" data-zoom="actual" class="map-zoom-level" aria-label="Zoom to 100%">100%</button>
<button type="button" data-zoom="in" aria-label="Zoom in">+</button>
</div>
<span class="map-hint">Drag to pan. Pinch, or hold ⌘/Ctrl and scroll, to zoom.</span>
</div>
<figure class="figure"><div class="stage map-stage"></div><div class="detail" hidden></div><figcaption></figcaption></figure>`
    viewsEl.append(mapSection)
    const stage = mapSection.querySelector('.map-stage')
    mapSection.querySelector('.map-controls').addEventListener('click', event => {
      const button = event.target.closest('button[data-zoom]')
      if (button == null) return
      const action = button.dataset.zoom
      if (action === 'fit') fitMap()
      else setMapZoom(action === 'actual' ? 1 : action === 'in' ? mapZoom * 1.25 : mapZoom / 1.25)
    })
    stage.addEventListener(
      'wheel',
      event => {
        if (!event.ctrlKey && !event.metaKey) return
        event.preventDefault()
        setMapZoom(mapZoom * Math.exp(-event.deltaY * 0.0015), { x: event.clientX, y: event.clientY })
      },
      { passive: false }
    )
    stage.addEventListener('pointerdown', event => {
      if (event.pointerType !== 'mouse' || event.button !== 0) return
      mapDrag = { x: event.clientX, y: event.clientY, left: stage.scrollLeft, top: stage.scrollTop, moved: false }
    })
    window.addEventListener('pointermove', event => {
      if (mapDrag == null) return
      const dx = event.clientX - mapDrag.x
      const dy = event.clientY - mapDrag.y
      if (!mapDrag.moved && Math.abs(dx) + Math.abs(dy) < 5) return
      mapDrag.moved = true
      stage.classList.add('panning')
      stage.scrollLeft = mapDrag.left - dx
      stage.scrollTop = mapDrag.top - dy
    })
    window.addEventListener('pointerup', () => {
      if (mapDrag?.moved) mapSuppressClick = true
      mapDrag = null
      stage.classList.remove('panning')
    })
    stage.addEventListener(
      'click',
      event => {
        if (!mapSuppressClick) return
        mapSuppressClick = false
        event.preventDefault()
        event.stopPropagation()
      },
      true
    )
    return mapSection
  }
  function setMapZoom(zoom, focus) {
    const stage = mapSection.querySelector('.map-stage')
    const svg = stage.querySelector('svg')
    if (svg == null) return
    const next = Math.min(4, Math.max(0.1, zoom))
    const rect = stage.getBoundingClientRect()
    const focusX = focus == null ? stage.clientWidth / 2 : focus.x - rect.left
    const focusY = focus == null ? stage.clientHeight / 2 : focus.y - rect.top
    const contentX = (stage.scrollLeft + focusX) / mapZoom
    const contentY = (stage.scrollTop + focusY) / mapZoom
    mapZoom = next
    svg.style.width = `${Math.round(mapNatural.width * mapZoom)}px`
    svg.style.height = `${Math.round(mapNatural.height * mapZoom)}px`
    stage.style.height = `${Math.round(Math.min(mapMaxHeight(), Math.max(320, mapNatural.height * mapZoom + 34)))}px`
    stage.scrollLeft = contentX * mapZoom - focusX
    stage.scrollTop = contentY * mapZoom - focusY
    mapSection.querySelector('.map-zoom-level').textContent = `${Math.round(mapZoom * 100)}%`
  }
  function mapMaxHeight() {
    return Math.min(window.innerHeight * 0.74, 920)
  }
  function fitMap() {
    const stage = mapSection.querySelector('.map-stage')
    const fit = Math.min(1.25, (stage.clientWidth - 32) / mapNatural.width, (mapMaxHeight() - 34) / mapNatural.height)
    setMapZoom(fit)
    stage.scrollLeft = 0
    stage.scrollTop = 0
  }
  function renderDepthButtons() {
    const maxDepth = treeDepth(mapRoot)
    const group = mapSection.querySelector('.map-depth')
    const buttons = Array.from({ length: maxDepth + 1 }, (_, depth) => {
      const button = document.createElement('button')
      button.type = 'button'
      button.textContent = depth === 0 ? 'Top level' : depth === maxDepth ? 'All levels' : depth === 1 ? '1 level' : `${depth} levels`
      button.setAttribute('aria-pressed', String(mapOverrides.size === 0 && depth === mapDepth))
      button.addEventListener('click', () => setMapDepth(depth))
      return button
    })
    if (mapOverrides.size > 0) {
      const reset = document.createElement('button')
      reset.type = 'button'
      reset.textContent = 'Reset'
      reset.title = 'Undo the groups you opened or closed one by one'
      reset.addEventListener('click', () => setMapDepth(mapDepth))
      buttons.push(reset)
    }
    group.replaceChildren(...buttons)
    group.hidden = maxDepth < 1
  }
  function toggleMapBranch(badge) {
    const opening = badge.dataset.mapOpen != null
    mapOverrides.set(opening ? badge.dataset.mapOpen : badge.dataset.mapClose, opening)
    renderDepthButtons()
    renderMap()
    renderMapChrome()
  }
  function addMapToggles() {
    const titled = (element, text) => {
      const title = document.createElementNS(SVG_NS, 'title')
      title.textContent = text
      element.prepend(title)
    }
    for (const node of mapSection.querySelectorAll('.stage g.node.drill')) {
      const target = views.get(node.dataset.target)
      const badge = node.querySelector('.badge')
      if (target == null || badge == null || !mapChildren(node.dataset.home).includes(target.id) || lastMapExpansion.has(target.id)) continue
      badge.classList.add('map-toggle')
      badge.dataset.mapOpen = target.id
      badge.querySelector('path').setAttribute('d', 'M-3.5 0 H3.5 M0 -3.5 V3.5')
      titled(badge, `Open ${target.title} here`)
    }
    for (const cluster of mapSection.querySelectorAll('.stage g.cluster')) {
      const name = cluster.dataset.name ?? ''
      const view = views.get(name.slice('cluster_v_'.length))
      const shape = cluster.querySelector('path, polygon')
      if (!name.startsWith('cluster_v_') || name.includes('__') || view == null || shape == null) continue
      const box = shape.getBBox()
      const badge = document.createElementNS(SVG_NS, 'g')
      badge.setAttribute('class', 'badge map-toggle')
      badge.setAttribute('transform', `translate(${box.x + box.width - 12} ${box.y + 12})`)
      badge.dataset.mapClose = view.id
      const circle = document.createElementNS(SVG_NS, 'circle')
      circle.setAttribute('r', '7.5')
      const mark = document.createElementNS(SVG_NS, 'path')
      mark.setAttribute('d', 'M-3.5 0 H3.5')
      badge.append(circle, mark)
      titled(badge, `Close ${view.title} back into a box`)
      ;(cluster.querySelector('a') ?? cluster).append(badge)
    }
  }
  function setMapDepth(depth) {
    mapOverrides.clear()
    mapDepth = depth
    try {
      localStorage.setItem(MAP_DEPTH_KEY, String(depth))
    } catch {}
    renderDepthButtons()
    renderMap()
    renderMapChrome()
  }
  function storedMapDepth() {
    try {
      const stored = Number.parseInt(localStorage.getItem(MAP_DEPTH_KEY) ?? '', 10)
      return Number.isFinite(stored) && stored >= 0 ? stored : null
    } catch {
      return null
    }
  }
  function renderMap() {
    const key = `${revision}|${mapRoot}|${mapDepth}|${[...mapOverrides].join(';')}`
    if (key === mapKey) return
    mapKey = key
    const stage = mapSection.querySelector('.map-stage')
    const { dot, views: shown } = buildMapDot(mapRoot, mapDepth)
    let svg = null
    try {
      svg = viz.renderSVGElement(dot, LAYOUT)
    } catch (failure) {
      const message = document.createElement('p')
      message.className = 'load-error'
      message.textContent = `The whole map could not be drawn: ${failure?.message ?? failure}`
      stage.replaceChildren(message)
      return
